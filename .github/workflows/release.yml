# Push a tag that matches manifest.json's version (e.g. 0.1.0, no "v") to publish a release.
name: Release

on:
  push:
    tags: ["*"]

permissions:
  contents: write
  # For build provenance attestations on the release assets.
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Check the tag matches the version files
        run: |
          tag="$GITHUB_REF_NAME"
          manifest=$(node -p "require('./manifest.json').version")
          package=$(node -p "require('./package.json').version")
          [ "$manifest" = "$tag" ] || { echo "Tag $tag != manifest.json version $manifest"; exit 1; }
          [ "$package" = "$tag" ] || { echo "Tag $tag != package.json version $package"; exit 1; }
          # Obsidian reads versions.json to find a compatible release for older app versions.
          min=$(node -p "require('./manifest.json').minAppVersion")
          listed=$(node -p "require('./versions.json')[process.argv[1]] ?? ''" "$tag")
          [ "$listed" = "$min" ] || { echo "versions.json[$tag] is '$listed', expected minAppVersion $min"; exit 1; }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css --title "$GITHUB_REF_NAME" --generate-notes
